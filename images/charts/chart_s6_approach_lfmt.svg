<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="100%" height="100%" style="background-color: #0b1120; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;">
  <defs>
    <pattern id="appGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="960" height="760" fill="#0b1120"/>
  <rect width="960" height="760" fill="url(#appGrid)" opacity="0.6"/>

  <!-- Border -->
  <rect x="16" y="16" width="928" height="728" fill="none" stroke="#334155" stroke-width="1.5" rx="8"/>

  <!-- ================= HEADER BANNER ================= -->
  <rect x="16" y="16" width="928" height="68" fill="#0f172a" rx="8"/>
  <line x1="16" y1="84" x2="944" y2="84" stroke="#334155" stroke-width="1.5"/>

  <text x="36" y="44" fill="#38bdf8" font-size="14" font-weight="bold" letter-spacing="2">LFMT / BLAGNAC-MONTPELLIER</text>
  <text x="36" y="66" fill="#f8fafc" font-size="18" font-weight="900" letter-spacing="1">INSTRUMENT APPROACH CHART • ILS or LOC RWY 14L</text>

  <!-- Navigation Frequency Box (Top Right) -->
  <g transform="translate(620, 24)">
    <rect x="0" y="0" width="304" height="48" fill="#1e293b" rx="6" stroke="#475569" stroke-width="1"/>
    <text x="12" y="18" fill="#94a3b8" font-size="9">LOC I-MT: <tspan fill="#38bdf8" font-weight="bold">109.30 MHz</tspan> • CRS: <tspan fill="#f8fafc" font-weight="bold">142°</tspan></text>
    <text x="12" y="36" fill="#94a3b8" font-size="9">FAF: <tspan fill="#facc15" font-weight="bold">5.2 DME (2,000')</tspan> • DA(H): <tspan fill="#10b981" font-weight="bold">692' (200')</tspan></text>
  </g>

  <!-- ================= SECTION 1: PLAN VIEW (TOP 50%) ================= -->
  <rect x="24" y="92" width="912" height="310" fill="#0f172a" rx="6" stroke="#1e293b" stroke-width="1"/>
  <text x="36" y="112" fill="#94a3b8" font-size="10" font-weight="bold" letter-spacing="1">PLAN VIEW (OVERHEAD TRACK)</text>

  <!-- Missed Approach Text Callout Box -->
  <g transform="translate(480, 102)">
    <rect x="0" y="0" width="440" height="44" fill="#1e293b" rx="4" stroke="#ef4444" stroke-width="1.2"/>
    <text x="12" y="16" fill="#ef4444" font-size="9" font-weight="900">MISSED APPROACH (GO-AROUND) PROCEDURE:</text>
    <text x="12" y="32" fill="#cbd5e1" font-size="9">Climb straight ahead on runway track 142° to 2,500'. Then turn left climbing to 4,000' direct TOU VOR and hold.</text>
  </g>

  <!-- Inbound Course Line (142° Magnetic) -->
  <!-- Extended Centerline -->
  <line x1="80" y1="180" x2="680" y2="330" stroke="#0284c7" stroke-width="3"/>
  <line x1="80" y1="180" x2="680" y2="330" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8,6"/>

  <!-- Localizer Feather Symbol (Runway End) -->
  <polygon points="680,330 650,316 650,344" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="590" y="356" fill="#38bdf8" font-size="10" font-weight="bold">LOC CRS 142°</text>

  <!-- Runway 14L / 32R -->
  <rect x="680" y="325" width="80" height="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" transform="rotate(12, 680, 325)"/>
  <text x="765" y="355" fill="#f8fafc" font-size="11" font-weight="900">RWY 14L</text>
  <text x="765" y="367" fill="#94a3b8" font-size="8">TDZE 492'</text>

  <!-- IAF CAPDENAC (5,000 FT) -->
  <g transform="translate(120, 190)">
    <polygon points="0,-8 8,6 -8,6" fill="#a855f7" stroke="#c084fc" stroke-width="1.5"/>
    <rect x="-45" y="12" width="90" height="26" fill="#1e293b" rx="3" stroke="#a855f7" stroke-width="1"/>
    <text x="-40" y="24" fill="#f8fafc" font-size="9" font-weight="bold">CAPDENAC</text>
    <text x="-40" y="34" fill="#c084fc" font-size="8">IAF 5,000'</text>
  </g>

  <!-- IF BLAGY (4,000 FT) -->
  <g transform="translate(280, 230)">
    <polygon points="0,-8 8,6 -8,6" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="-35" y="12" width="70" height="26" fill="#1e293b" rx="3" stroke="#38bdf8" stroke-width="1"/>
    <text x="-30" y="24" fill="#f8fafc" font-size="9" font-weight="bold">BLAGY</text>
    <text x="-30" y="34" fill="#38bdf8" font-size="8">IF 4,000'</text>
  </g>

  <!-- FAF 5.2 DME (2,000 FT) - MALTESE CROSS -->
  <g transform="translate(460, 275)">
    <!-- Maltese Cross -->
    <path d="M 0,-10 L 3,-4 L 9,-9 L 4,-3 L 10,0 L 4,3 L 9,9 L 3,4 L 0,10 L -3,4 L -9,9 L -4,3 L -10,0 L -4,-3 L -9,-9 L -3,-4 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1"/>
    <rect x="-40" y="14" width="80" height="28" fill="#1e293b" rx="3" stroke="#facc15" stroke-width="1.2"/>
    <text x="-34" y="26" fill="#facc15" font-size="9" font-weight="bold">FAF 5.2 DME</text>
    <text x="-34" y="37" fill="#f8fafc" font-size="8">2,000 FT</text>
  </g>

  <!-- Missed Approach Track Graphic (Red Dashed) -->
  <path d="M 720 340 L 820 365 Q 880 340 850 240 T 720 180" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="720,180 732,174 728,186" fill="#ef4444"/>
  <rect x="760" y="200" width="115" height="22" fill="#0f172a" rx="3" stroke="#ef4444" stroke-width="1"/>
  <text x="766" y="214" fill="#ef4444" font-size="8" font-weight="bold">CLIMB TO 4,000' TOU</text>

  <!-- ================= SECTION 2: PROFILE VIEW (MIDDLE 30%) ================= -->
  <rect x="24" y="412" width="912" height="195" fill="#0f172a" rx="6" stroke="#334155" stroke-width="1"/>
  <text x="36" y="432" fill="#94a3b8" font-size="10" font-weight="bold" letter-spacing="1">PROFILE VIEW (VERTICAL DESCENT PROFILE)</text>

  <!-- Altitude Axis & Grid Lines -->
  <g transform="translate(60, 435)">
    <!-- Baseline Ground Level -->
    <line x1="0" y1="140" x2="840" y2="140" stroke="#64748b" stroke-width="1.5"/>
    <text x="845" y="144" fill="#64748b" font-size="8">GND</text>

    <!-- 2,000 FT Grid Line -->
    <line x1="0" y1="80" x2="840" y2="80" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="-40" y="84" fill="#94a3b8" font-size="8">2,000'</text>

    <!-- 4,000 FT Grid Line -->
    <line x1="0" y1="20" x2="840" y2="20" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="-40" y="24" fill="#94a3b8" font-size="8">4,000'</text>

    <!-- Step Down Profile Line -->
    <!-- BLAGY (4,000') to FAF (2,000') -->
    <polyline points="40,20 200,20 340,80" fill="none" stroke="#38bdf8" stroke-width="2.5"/>

    <!-- FAF Maltese Cross at 5.2 DME -->
    <g transform="translate(340, 80)">
      <path d="M 0,-8 L 2,-3 L 7,-7 L 3,-2 L 8,0 L 3,2 L 7,7 L 2,3 L 0,8 L -2,3 L -7,7 L -3,2 L -8,0 L -3,-2 L -7,-7 L -2,-3 Z" fill="#facc15"/>
      <text x="-25" y="-12" fill="#facc15" font-size="8" font-weight="bold">FAF 5.2 DME</text>
    </g>

    <!-- 3.0° Electronic Glide Slope Beam -->
    <line x1="340" y1="80" x2="720" y2="135" stroke="#38bdf8" stroke-width="3"/>
    
    <!-- Glide Path Angle Label -->
    <rect x="440" y="90" width="80" height="18" fill="#1e293b" rx="3" stroke="#38bdf8" stroke-width="1"/>
    <text x="446" y="102" fill="#38bdf8" font-size="9" font-weight="bold">GS 3.00°</text>

    <!-- Decision Altitude Line: DA 692' (DH 200') -->
    <line x1="560" y1="125" x2="680" y2="125" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,2"/>
    <rect x="580" y="115" width="80" height="16" fill="#065f46" rx="2"/>
    <text x="584" y="126" fill="#a7f3d0" font-size="8" font-weight="bold">DA 692' (200')</text>

    <!-- Runway Threshold & Elevation -->
    <polygon points="720,135 730,135 730,140 720,140" fill="#f8fafc"/>
    <text x="710" y="152" fill="#f8fafc" font-size="8" font-weight="bold">TCH 50'</text>
    <text x="740" y="148" fill="#94a3b8" font-size="8">TDZE 492'</text>

    <!-- Distance Axis Marks (DME) -->
    <text x="40" y="155" fill="#64748b" font-size="8">12 DME</text>
    <text x="200" y="155" fill="#64748b" font-size="8">9 DME (BLAGY)</text>
    <text x="340" y="155" fill="#facc15" font-size="8" font-weight="bold">5.2 DME (FAF)</text>
    <text x="560" y="155" fill="#10b981" font-size="8">1.8 DME (DA)</text>
    <text x="720" y="155" fill="#f8fafc" font-size="8">0 DME (THR)</text>
  </g>

  <!-- ================= SECTION 3: LANDING MINIMUMS BOX (BOTTOM) ================= -->
  <g transform="translate(24, 618)">
    <rect x="0" y="0" width="912" height="116" fill="#0f172a" rx="6" stroke="#334155" stroke-width="1"/>
    
    <!-- Header of Minimums Table -->
    <rect x="0" y="0" width="912" height="26" fill="#1e293b" rx="6"/>
    <text x="14" y="17" fill="#e2e8f0" font-size="10" font-weight="bold">AIRCRAFT CATEGORY &amp; LANDING MINIMUMS TABLE</text>
    <text x="720" y="17" fill="#94a3b8" font-size="9">STRAIGHT-IN RWY 14L</text>

    <!-- Table Columns -->
    <g transform="translate(14, 38)">
      <!-- CAT I ILS Column -->
      <rect x="0" y="0" width="280" height="64" fill="#064e3b" rx="4" stroke="#059669" stroke-width="1.2"/>
      <text x="12" y="18" fill="#a7f3d0" font-size="11" font-weight="900">CAT I ILS (PRECISION)</text>
      <text x="12" y="36" fill="#f8fafc" font-size="13" font-weight="900">DA 692 FT <tspan font-size="10" fill="#a7f3d0">(DH 200 FT)</tspan></text>
      <text x="12" y="52" fill="#6ee7b7" font-size="10" font-weight="bold">RVR: 550 METRES (OR VIS 800m)</text>

      <!-- LOC Only Column -->
      <rect x="295" y="0" width="280" height="64" fill="#1e293b" rx="4" stroke="#475569" stroke-width="1"/>
      <text x="307" y="18" fill="#cbd5e1" font-size="11" font-weight="bold">LOC ONLY (NON-PRECISION)</text>
      <text x="307" y="36" fill="#f8fafc" font-size="13" font-weight="900">MDA 890 FT <tspan font-size="10" fill="#94a3b8">(MDH 395 FT)</tspan></text>
      <text x="307" y="52" fill="#94a3b8" font-size="10">VISIBILITY: 1,500 METRES</text>

      <!-- Circling Column -->
      <rect x="590" y="0" width="290" height="64" fill="#1e293b" rx="4" stroke="#475569" stroke-width="1"/>
      <text x="602" y="18" fill="#cbd5e1" font-size="11" font-weight="bold">CIRCLING (VISUAL MANEUVER)</text>
      <text x="602" y="36" fill="#f8fafc" font-size="13" font-weight="900">MDA 1,050 FT <tspan font-size="10" fill="#94a3b8">(MDH 555 FT)</tspan></text>
      <text x="602" y="52" fill="#94a3b8" font-size="10">VISIBILITY: 2,400 METRES</text>
    </g>
  </g>

</svg>

